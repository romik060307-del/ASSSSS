plugins { id 'com.android.application' }

android {
    namespace 'com.rk.ohlisocial'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rk.ohlisocial'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
        buildConfigField 'String', 'OHLI_URL', '"https://towers-professor-serial-recordings.trycloudflare.com/"'
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_8
        targetCompatibility JavaVersion.VERSION_8
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}
